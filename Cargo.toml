[package]
name = "nsh-app-lab-scanner"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"
log = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.5.1", default-features = false }
nsh-testing = { version = "0.5.1", default-features = false }
